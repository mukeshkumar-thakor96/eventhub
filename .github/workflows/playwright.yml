# ══════════════════════════════════════════════════════════════════════════════
# Playwright E2E Tests
#
# PURPOSE:
#   Runs the full Playwright test suite on every push to main and uploads the
#   HTML report as an artifact so results can be reviewed from the Actions UI.
#
# TRIGGER: push to main (plus manual runs via workflow_dispatch)
#
# NOTES:
#   - Tests run against the baseURL in playwright.config.ts (live site by
#     default; override with the BASE_URL repository variable if needed)
#   - Chromium only (as configured in playwright.config.ts)
#   - The HTML report is uploaded even when tests fail, and kept for 30 days
#   - The job is marked failed when any test fails
# ══════════════════════════════════════════════════════════════════════════════

name: Playwright E2E Tests

on:
  push:
    branches: [main]

  # Allow manual runs from the GitHub Actions UI
  workflow_dispatch:

# Tests share one account with FIFO booking/event limits, so never run two
# suites at the same time; queue new runs instead of cancelling mid-suite.
concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  CI: true

jobs:
  playwright:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Node.js setup ────────────────────────────────────────────────────────
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # ── Install root dependencies (Playwright lives at the repo root) ────────
      - name: Install dependencies
        run: npm ci

      # ── Install Playwright browser + OS dependencies ─────────────────────────
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # ── Run all Playwright tests ─────────────────────────────────────────────
      # html → browsable report in playwright-report/, line → readable CI log.
      - name: Run Playwright tests
        run: npx playwright test --reporter=html,line
        env:
          BASE_URL: ${{ vars.BASE_URL }}

      # ── Upload HTML report (always, so failures can be inspected) ────────────
      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 30
